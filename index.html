<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كلام تونسي ← نص</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f0fdfa;
      color: #134e4a;
      padding: 16px;
      line-height: 1.6;
    }
    .box {
      max-width: 640px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(15,118,110,0.12);
      border: 1px solid #99f6e4;
    }
    h1 { text-align: center; color: #0f766e; font-size: 1.5rem; margin-bottom: 8px; }
    .sub { text-align: center; color: #0d9488; margin-bottom: 16px; font-size: 0.95rem; }
    .warn {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .warn.show { display: block; }
    #status {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #0f766e;
      font-weight: 600;
      margin-bottom: 16px;
    }
    #status.rec { background: #fef2f2; color: #dc2626; }
    #status.err { background: #fef2f2; color: #dc2626; }
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btnStart { background: #0f766e; color: white; }
    #btnStop { background: #dc2626; color: white; }
    #btnSave { background: #16a34a; color: white; }
    #btnClear { background: #e2e8f0; color: #334155; }
    #btnTest { background: #7c3aed; color: white; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #0f766e; }
    #liveText {
      min-height: 120px;
      border: 2px solid #99f6e4;
      border-radius: 12px;
      padding: 12px;
      background: #f8fafc;
      font-size: 1.1rem;
      white-space: pre-wrap;
      margin-bottom: 16px;
      direction: rtl;
    }
    #log {
      background: #1e293b;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      border-radius: 8px;
      max-height: 150px;
      overflow-y: auto;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
    }
    .pages { margin-top: 20px; }
    .page {
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .page-date { font-size: 0.8rem; color: #64748b; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎤 كلام تونسي ← نص</h1>
    <p class="sub">نسخة مبسطة ومصححة</p>

    <div class="warn" id="warn">
      ⚠️ أنت فاتح الملف مباشرة (file://). الميكروفون ما يخدمش.<br>
      شغّل الأمر: <b>python3 -m http.server 8080</b><br>
      وبعدها افتح: <b>http://localhost:8080/stt.html</b>
    </div>

    <div id="status">جاهز</div>

    <div class="btns">
      <button id="btnTest">اختبار الميكروفون</button>
      <button id="btnStart">🎙️ ابدأ التسجيل</button>
      <button id="btnStop" disabled>⏹️ وقف</button>
    </div>

    <label>النص:</label>
    <div id="liveText" contenteditable="true"></div>

    <div class="btns">
      <button id="btnSave" disabled>💾 احفظ</button>
      <button id="btnClear">🗑️ امسح</button>
    </div>

    <div class="pages">
      <h3 style="margin-bottom:10px;color:#0f766e">الصفحات المحفوظة</h3>
      <div id="pagesList"></div>
    </div>

    <p style="margin-top:16px;font-size:0.85rem;color:#64748b">سجل الأخطاء (للتشخيص):</p>
    <div id="log"></div>
  </div>

  <script>
    // ========== أدوات التشخيص ==========
    const logEl = document.getElementById("log");
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // تحذير file://
    if (location.protocol === "file:") {
      document.getElementById("warn").classList.add("show");
      log("WARNING: opened as file:// — microphone will not work");
    } else {
      log("OK: running on " + location.origin);
    }

    // ========== العناصر ==========
    const statusEl = document.getElementById("status");
    const liveText = document.getElementById("liveText");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");
    const btnSave = document.getElementById("btnSave");
    const btnClear = document.getElementById("btnClear");
    const btnTest = document.getElementById("btnTest");
    const pagesList = document.getElementById("pagesList");

    let recognition = null;
    let isRecording = false;
    let finalText = "";

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = type || "";
    }

    // ========== اختبار الميكروفون ==========
    btnTest.addEventListener("click", async () => {
      log("Testing microphone permission...");
      setStatus("جاري طلب صلاحية الميكروفون...");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        log("SUCCESS: microphone permission granted");
        setStatus("✅ الميكروفون شغال — الصلاحية موجودة");
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        log("ERROR mic: " + err.name + " — " + err.message);
        setStatus("❌ الميكروفون مرفوض أو غير موجود: " + err.name, "err");
        alert("الميكروفون ما اشتغلش.\n\nالسبب: " + err.name + "\n" + err.message + "\n\nتأكد إنك فاتح الصفحة على http://localhost مش ملف عادي.");
      }
    });

    // ========== التعرف على الكلام ==========
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SR) {
      log("ERROR: SpeechRecognition not supported");
      setStatus("❌ المتصفح ما يدعمش التعرف على الكلام. استعمل Chrome", "err");
      btnStart.disabled = true;
    } else {
      log("SpeechRecognition available");
      recognition = new SR();
      recognition.lang = "ar-TN";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        setStatus("🔴 قاعد يسجّل... احكي", "rec");
        btnStart.disabled = true;
        btnStop.disabled = false;
        log("recognition started");
      };

      recognition.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += t + " ";
          else interim += t;
        }
        liveText.textContent = finalText + interim;
        btnSave.disabled = !finalText.trim();
      };

      recognition.onerror = (e) => {
        log("recognition error: " + e.error);
        let msg = "خطأ: " + e.error;
        if (e.error === "not-allowed") msg = "❌ صلاحية الميكروفون مرفوضة";
        if (e.error === "no-speech") msg = "ما سمعتش كلام";
        if (e.error === "network") msg = "مشكلة شبكة (التعرف يحتاج إنترنت)";
        setStatus(msg, "err");
        stopRec();
      };

      recognition.onend = () => {
        log("recognition ended");
        if (isRecording) {
          try { recognition.start(); log("restarted recognition"); }
          catch (e) { stopRec(); }
        }
      };
    }

    function stopRec() {
      isRecording = false;
      try { if (recognition) recognition.stop(); } catch(e) {}
      btnStart.disabled = false;
      btnStop.disabled = true;
      btnSave.disabled = !liveText.textContent.trim();
      if (!statusEl.classList.contains("err")) setStatus("تم الإيقاف");
    }

    btnStart.addEventListener("click", async () => {
      log("Start button clicked");
      if (!recognition) {
        setStatus("❌ التعرف غير متوفر", "err");
        return;
      }
      // طلب الصلاحية أولاً
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        log("mic permission OK before start");
      } catch (err) {
        log("mic permission failed: " + err.name);
        setStatus("❌ اسمح بالميكروفون أولاً (اضغط زر الاختبار)", "err");
        return;
      }

      finalText = liveText.textContent.trim() ? liveText.textContent + " " : "";
      try {
        recognition.start();
      } catch (err) {
        log("start() failed: " + err.message);
        setStatus("ما نجمش نبدأ: " + err.message, "err");
      }
    });

    btnStop.addEventListener("click", () => {
      log("Stop button clicked");
      stopRec();
    });

    btnClear.addEventListener("click", () => {
      finalText = "";
      liveText.textContent = "";
      btnSave.disabled = true;
      setStatus("جاهز");
      log("cleared");
    });

    // ========== الحفظ ==========
    const KEY = "stt_pages_simple";
    function getPages() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
    }
    function savePages(p) { localStorage.setItem(KEY, JSON.stringify(p)); }

    function renderPages() {
      const pages = getPages();
      if (!pages.length) {
        pagesList.innerHTML = "<p style='color:#94a3b8;text-align:center'>ما فماش صفحات بعد</p>";
        return;
      }
      pagesList.innerHTML = pages.map(p => {
        const d = new Date(p.date).toLocaleString("ar-TN");
        return `<div class="page"><div class="page-date">\( {d}</div><div> \){p.text.replace(/</g,"&lt;")}</div></div>`;
      }).join("");
    }

    btnSave.addEventListener("click", () => {
      const text = liveText.textContent.trim();
      if (!text) return;
      const pages = getPages();
      pages.unshift({ text, date: new Date().toISOString() });
      savePages(pages);
      finalText = "";
      liveText.textContent = "";
      btnSave.disabled = true;
      setStatus("✅ تم الحفظ");
      renderPages();
      log("page saved");
    });

    // تأكد أن الأزرار مربوطة
    log("All buttons attached");
    renderPages();
  </script>
</body>
</html>
